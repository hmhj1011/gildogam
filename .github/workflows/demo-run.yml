name: Demo run

# Builds the debug APK, runs it on an Android emulator, plays the demo console's
# virtual drives and uploads screenshots, a screen recording and logcat.
# The emulator is a stock Android image, so the Pleos SDK services are absent:
# the app falls back to Android voice and the demo console drives the car events.
on:
  workflow_dispatch:
  push:
    branches:
      - demo-run

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/demo-run.sh

      - name: Upload demo output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-run
          path: demo-out
          if-no-files-found: warn
