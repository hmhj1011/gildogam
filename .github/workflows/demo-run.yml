name: Demo run

# Builds the debug APK, runs it on an Android emulator, plays the demo console's
# virtual drives and uploads screenshots, a screen recording and logcat.
# The emulator is a stock Android image, so the Pleos SDK services are absent:
# the app falls back to Android voice and the demo console drives the car events.
on:
  workflow_dispatch:
  push:
    branches:
      - demo-run

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/demo-run.sh

      - name: Publish demo output to the demo-output branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -d demo-out ] || exit 0
          if [ -f demo-out/trip1.mp4 ]; then
            ffmpeg -y -loglevel error -i demo-out/trip1.mp4 -vf scale=1280:-2 -c:v libx264 -preset veryfast -crf 30 -an demo-out/trip1-720p.mp4 && rm demo-out/trip1.mp4
          fi
          rm -f demo-out/ui.xml
          cd demo-out
          git init -q -b demo-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-output

      - name: Upload demo output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-run
          path: demo-out
          if-no-files-found: warn
